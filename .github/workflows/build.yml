name: Build firmware

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Image variant (files-ap = example access-point overlay in configs/files-ap)"
        type: choice
        options:
          - generic
          - files-ap
          - both
        default: generic

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(inputs.variant == 'both' && '["generic","files-ap"]' || format('["{0}"]', inputs.variant)) }}

    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools python3-venv \
            rsync swig unzip zlib1g-dev file wget zstd \
            device-tree-compiler squashfs-tools

      - name: Check out
        uses: actions/checkout@v4

      - name: Restore download cache
        uses: actions/cache@v4
        with:
          path: build/dl
          key: dl-${{ hashFiles('patches/BASE', 'configs/ra81.config') }}-${{ github.run_id }}
          restore-keys: |
            dl-${{ hashFiles('patches/BASE', 'configs/ra81.config') }}-
            dl-

      - name: Build
        run: |
          if [ "${{ matrix.variant }}" = files-ap ]; then
            scripts/build.sh -j "$(nproc)" --files configs/files-ap
          else
            scripts/build.sh -j "$(nproc)"
          fi

      - name: Validate images
        run: |
          python3 -m venv build/venv-tools
          build/venv-tools/bin/pip install --quiet ubi_reader
          tools/validate-images.sh
          tools/test-dualboot.sh

      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: ra81-openwrt-${{ matrix.variant }}-${{ github.sha }}
          path: out/*/
          if-no-files-found: error
