name: Build firmware

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Image variant (files-ap = example access-point overlay in configs/files-ap)"
        type: choice
        options:
          - generic
          - files-ap
          - both
        default: generic
      release:
        description: "Publish the images as a GitHub Release"
        type: boolean
        default: true

permissions:
  contents: read

env:
  # Each release's package repository (kmods and the other =m packages of that
  # build) is published on the gh-pages branch under <tag>/; the image lists it.
  PAGES_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
  KEEP: "10"                     # package repositories kept on gh-pages

jobs:
  build:
    name: Build (${{ inputs.variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools python3-venv \
            rsync swig unzip zlib1g-dev file wget zstd \
            device-tree-compiler squashfs-tools

      - name: Check out
        uses: actions/checkout@v4

      - name: Test build wrapper
        run: tools/test-build.sh

      - name: Restore download cache
        uses: actions/cache@v4
        with:
          path: build/dl
          key: dl-${{ hashFiles('patches/BASE', 'configs/ra81.config') }}-${{ github.run_id }}
          restore-keys: |
            dl-${{ hashFiles('patches/BASE', 'configs/ra81.config') }}-
            dl-

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: build/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('patches/BASE', 'configs/ra81.config') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('patches/BASE', 'configs/ra81.config') }}-
            ccache-${{ runner.os }}-${{ runner.arch }}-

      # Known before the build: the image carries the URL of its repository.
      - name: Release tag
        id: tag
        run: |
          label=$(sed -n 's/^OPENWRT_LABEL=//p' patches/BASE)
          echo "tag=ra81-${label}-run${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Prepare validation tools
        run: |
          python3 -m venv build/venv-tools
          build/venv-tools/bin/pip install --quiet ubi_reader

      # Reuse the toolchain and compiled packages for the second image. Validate
      # each variant before the next build replaces bin/targets outputs.
      - name: Build and validate
        env:
          VARIANT: ${{ inputs.variant }}
          RELEASE: ${{ inputs.release }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          variants=("$VARIANT")
          [ "$VARIANT" != both ] || variants=(generic files-ap)
          # Without a release nothing is published, so the image lists no repository.
          repo=()
          [ "$RELEASE" != true ] || repo=(--repo "$PAGES_BASE/$TAG")
          for variant in "${variants[@]}"; do
            args=("${repo[@]}")
            [ "$variant" != files-ap ] || args+=(--files configs/files-ap)
            scripts/build.sh -j "$(nproc)" "${args[@]}"
            tools/validate-images.sh
          done
          tools/test-dualboot.sh
          "$(sed -n 's/^SRC=//p' patches/BASE)/staging_dir/host/bin/ccache" --show-stats

      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: ra81-openwrt-${{ inputs.variant }}-${{ github.sha }}
          path: out/
          if-no-files-found: error

  pages:
    name: Publish package repository
    needs: build
    if: inputs.release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - name: Download images
        uses: actions/download-artifact@v4
        with:
          pattern: ra81-openwrt-*-${{ github.sha }}
          path: artifacts

      # Every variant of a run is built in the same tree: one repository serves all.
      - name: Push to gh-pages
        run: |
          set -euo pipefail
          repos=(artifacts/*/*/packages)
          repo=$(cd "${repos[0]}" && pwd)
          [ -f "$repo/packages.adb" ] || { echo "::error::no package index"; exit 1; }
          compgen -G "$repo/kernel-*.apk" >/dev/null || { echo "::error::no kernel package"; exit 1; }
          compgen -G "$repo/kmod-wireguard-*.apk" >/dev/null || { echo "::error::kmod-wireguard missing"; exit 1; }
          mkdir site && cd site
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth=1 origin gh-pages 2>/dev/null; then
            git checkout -q FETCH_HEAD -- .
          fi
          rm -rf "$TAG"
          cp -a "$repo" "$TAG"
          # Repositories, oldest first (by run number); keep the newest $KEEP.
          by_run() { for d in ra81-*-run*; do [ -d "$d" ] || continue; echo "${d##*-run} $d"; done | sort -n | cut -d' ' -f2; }
          by_run | head -n -"$KEEP" | xargs -r rm -rf --
          touch .nojekyll
          {
            echo "# RA81 OpenWrt package repositories"
            echo
            echo "One directory per release of \`${GITHUB_REPOSITORY}\`: the kernel modules and"
            echo "other packages of that build. They only install on an image of the same"
            echo "release, which lists its directory in \`/etc/apk/repositories.d/distfeeds.list\`."
            echo
            for d in $(by_run | tac); do
              echo "- [${d}](${d}/packages.adb), [release](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${d})"
            done
          } > index.md
          git add -A
          # One commit, no history: old repositories are not kept in the branch.
          git checkout -q --orphan gh-pages-new
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com \
            commit -qm "package repositories, newest ${TAG}"
          git push -q --force origin gh-pages-new:gh-pages
          echo "published ${PAGES_BASE}/${TAG}/packages.adb ($(find "$repo" -name '*.apk' | wc -l) packages)" >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish release
    needs: [build, pages]
    if: inputs.release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Download images
        uses: actions/download-artifact@v4
        with:
          pattern: ra81-openwrt-*-${{ github.sha }}
          path: artifacts

      - name: Collect release assets
        id: assets
        run: |
          mkdir -p release
          for dir in artifacts/*/*/; do
            variant=generic
            case "$dir" in *-files-ap/) variant=files-ap ;; esac
            for f in "$dir"*xiaomi_redmi-ax3000*; do
              name=$(basename "$f")
              [ "$variant" = generic ] || name=${name/xiaomi_redmi-ax3000/xiaomi_redmi-ax3000-$variant}
              cp "$f" "release/$name"
            done
          done
          (cd release && sha256sum -- ./* | sed 's# \./# #') > sha256sums
          mv sha256sums release/
          cat release/sha256sums
          # Output dir name, e.g. v25.12.5-r33051-f5dae5ece4[-files-ap]
          dirs=(artifacts/*/*/)
          version=$(basename "${dirs[0]}")
          version=${version%-files-ap}
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ steps.assets.outputs.version }}
        run: |
          {
            echo "OpenWrt $VERSION for the Xiaomi Redmi AX3000 (RA81), built from ${GITHUB_SHA::7}."
            echo
            echo "Patches:"
            for p in patches/*.patch; do echo "- \`$(basename "$p")\`"; done
            echo
            echo "| File | Use |"
            echo "|---|---|"
            echo "| \`*-squashfs-factory.ubi\` | first install into a dual-boot slot (\`scripts/ra81-install-slot.sh\`) |"
            echo "| \`*-squashfs-sysupgrade.bin\` | upgrade from this firmware (\`sysupgrade\`) |"
            echo "| \`*-initramfs-uImage.itb\` | RAM boot via U-Boot TFTP (UART) |"
            echo
            echo "Files with \`-files-ap\` in the name contain the example access-point overlay"
            echo "(\`configs/files-ap\`: 10.0.0.3/23, no DHCP server) — only for networks that match it."
            echo
            echo "Packages: \`apk update && apk add kmod-<name>\` installs the kernel modules of"
            echo "this build from its own repository, which the image already lists:"
            echo "\`$PAGES_BASE/$TAG/packages.adb\`. Kernel modules from other builds or from"
            echo "downloads.openwrt.org do not load on this kernel."
            echo
            echo "**Only for the RA81.** Read the README (install, recovery, limitations) before flashing."
            echo
            echo '```'
            cat release/sha256sums
            echo '```'
          } > notes.md
          gh release create "$TAG" release/* \
            --target "$GITHUB_SHA" \
            --title "RA81 OpenWrt $VERSION (build ${{ github.run_number }})" \
            --notes-file notes.md
